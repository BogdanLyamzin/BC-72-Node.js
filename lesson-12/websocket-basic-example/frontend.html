<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Title</title>
</head>
    <style>
        .hidden {
            display: none;
        }
    </style>
<body>

    <ul id="message-list"></ul>
    <button class="hidden" id="close-socket">Close</button>

    <script>
        const messageList = document.getElementById("message-list");
        const closeSocketButton = document.getElementById("close-socket");

        const socket = new WebSocket("ws://localhost:5000");
        // socket.onopen = ()=> messageList.insertAdjacentHTML("beforeend", "<li>Success connected</li>");
        const closeConnection = ()=> {
            socket.close(1000, "Close connection");
            closeSocketButton.classList.add("hidden");
        };

        socket.addEventListener("open", ()=> {
            messageList.insertAdjacentHTML("beforeend", "<li>Success connected</li>");
            closeSocketButton.classList.remove("hidden");
            closeSocketButton.addEventListener("click", closeConnection);
        })

        socket.addEventListener("message", (e)=> {
            messageList.insertAdjacentHTML("beforeend", `<li>${e.data}</li>`);
        })

        socket.addEventListener("close", event => {
            if(!event.wasClean) {
                return messageList.insertAdjacentHTML("beforeend", `<li>Server crashed</li>`);
            }
            else {
                messageList.insertAdjacentHTML("beforeend", `<li>${event.reason}</li>`);
            }
            closeSocketButton.classList.add("hidden");
            closeSocketButton.removeEventListener("click", closeConnection);
            // console.log(event.code);
            // console.log(event.reason);
            // console.log(event.wasClean);
        })
    </script>
</body>

</html>
